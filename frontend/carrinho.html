<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - LUMIÉ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="faixa-topo">✨ FRETE GRÁTIS para compras acima de R$199</div>
    <nav class="navbar" id="navbar"></nav>

    <main class="container">
        <h2>Seu carrinho</h2>
        <div id="mensagem"></div>
        <div id="listaCarrinho"></div>

        <div class="resumo-pedido" id="resumoPedido" style="display:none;">
            <div class="linha-total">
                <span>Subtotal</span>
                <span id="subtotalTexto">R$ 0,00</span>
            </div>
            <div class="linha-total">
                <span>Frete</span>
                <span id="freteTexto">R$ 10,00</span>
            </div>
            <div class="linha-total total-final">
                <span>Total</span>
                <span id="totalTexto">R$ 0,00</span>
            </div>
            <button id="btnCheckout" class="btn btn-laranja btn-bloco" style="margin-top:10px;">
                Finalizar pedido
            </button>
        </div>
    </main>

    <script src="js/carrinho.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
