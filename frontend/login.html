<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - LUMIÉ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="faixa-topo">✨ FRETE GRÁTIS para compras acima de R$199</div>
    <nav class="navbar" id="navbar"></nav>

    <div class="form-card">
        <h2>Entrar</h2>
        <div id="mensagem"></div>

        <form id="formLogin">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" required>
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required>
            </div>
            <button type="submit" class="btn btn-primario btn-bloco">Entrar</button>
        </form>

        <p class="link-alt">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>

    <script src="js/carrinho.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
