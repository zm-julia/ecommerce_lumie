<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - LUMIÉ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="faixa-topo">✨ FRETE GRÁTIS para compras acima de R$199</div>
    <nav class="navbar" id="navbar"></nav>

    <div class="form-card">
        <h2>Criar conta</h2>
        <div id="mensagem"></div>

        <form id="formCadastro">
            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" required>
            </div>

            <div class="linha-campos">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required minlength="6">
                </div>
            </div>

            <div class="linha-campos">
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" placeholder="(00) 00000-0000" required>
                </div>
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required>
                </div>
            </div>
            <small id="avisoCpf" style="color:#c0392b;"></small>

            <hr>
            <p><strong>Endereço</strong> (digite o CEP para autocompletar)</p>

            <div class="linha-campos">
                <div class="campo">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" placeholder="00000-000" required>
                </div>
                <div class="campo">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" required>
                </div>
            </div>

            <div class="campo">
                <label for="logradouro">Rua</label>
                <input type="text" id="logradouro" required>
            </div>

            <div class="campo">
                <label for="complemento">Complemento (opcional)</label>
                <input type="text" id="complemento">
            </div>

            <div class="linha-campos">
                <div class="campo">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" required>
                </div>
                <div class="campo">
                    <label for="localidade">Cidade</label>
                    <input type="text" id="localidade" required>
                </div>
                <div class="campo">
                    <label for="uf">UF</label>
                    <input type="text" id="uf" maxlength="2" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primario btn-bloco">Criar conta</button>
        </form>

        <p class="link-alt">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>

    <script src="js/carrinho.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/validaCpf.js"></script>
    <script src="js/cep.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
