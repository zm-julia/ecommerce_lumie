<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - LUMIÉ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="faixa-topo">✨ FRETE GRÁTIS para compras acima de R$199</div>
    <nav class="navbar" id="navbar"></nav>

    <div class="form-card">
        <h2>Meu perfil</h2>
        <div id="mensagem"></div>

        <form id="formPerfil">
            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" required>
            </div>
            <div class="linha-campos">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" required>
                </div>
            </div>
            <div class="campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" required>
            </div>

            <hr>
            <p><strong>Endereço</strong></p>
            <div class="linha-campos">
                <div class="campo">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" required>
                </div>
                <div class="campo">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" required>
                </div>
            </div>
            <div class="campo">
                <label for="logradouro">Rua</label>
                <input type="text" id="logradouro" required>
            </div>
            <div class="linha-campos">
                <div class="campo">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" required>
                </div>
                <div class="campo">
                    <label for="localidade">Cidade</label>
                    <input type="text" id="localidade" required>
                </div>
                <div class="campo">
                    <label for="uf">UF</label>
                    <input type="text" id="uf" maxlength="2" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primario btn-bloco">Salvar alterações</button>
        </form>
    </div>

    <div class="form-card">
        <h2>Alterar senha</h2>
        <div id="mensagemSenha"></div>

        <form id="formSenha">
            <div class="linha-campos">
                <div class="campo">
                    <label for="novaSenha">Nova senha</label>
                    <input type="password" id="novaSenha" required>
                </div>
                <div class="campo">
                    <label for="confirmaSenha">Confirmar nova senha</label>
                    <input type="password" id="confirmaSenha" required>
                </div>
            </div>

            <button type="submit" class="btn btn-secundario btn-bloco">Alterar senha</button>
        </form>
    </div>

    <script src="js/carrinho.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/validaCpf.js"></script>
    <script src="js/cep.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
